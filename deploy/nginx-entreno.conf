# /etc/nginx/sites-available/entreno.ferranguinart.com
#   sudo cp deploy/nginx-entreno.conf /etc/nginx/sites-available/entreno.ferranguinart.com
#   sudo ln -s /etc/nginx/sites-available/entreno.ferranguinart.com /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d entreno.ferranguinart.com   # añade el bloque 443 y redirección

server {
    listen 80;
    listen [::]:80;
    server_name entreno.ferranguinart.com;

    client_max_body_size 5m;

    location / {
        proxy_pass http://127.0.0.1:8020;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
