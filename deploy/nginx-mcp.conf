# /etc/nginx/sites-available/mcp.ferranguinart.com — lo instala setup-mcp.sh;
# certbot --nginx añade luego el bloque 443 y la redirección a HTTPS.

# Freno extra a la fuerza bruta (además del de la app): login y tokens.
limit_req_zone $binary_remote_addr zone=mcp_auth:1m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name mcp.ferranguinart.com;

    client_max_body_size 1m;
    server_tokens off;

    location = /authorize {
        limit_req zone=mcp_auth burst=10 nodelay;
        proxy_pass http://127.0.0.1:8021;
        include /etc/nginx/proxy_params;
    }
    location = /token {
        limit_req zone=mcp_auth burst=20 nodelay;
        proxy_pass http://127.0.0.1:8021;
        include /etc/nginx/proxy_params;
    }
    location / {
        proxy_pass http://127.0.0.1:8021;
        include /etc/nginx/proxy_params;
        proxy_http_version 1.1;
        proxy_read_timeout 60s;
    }
}
